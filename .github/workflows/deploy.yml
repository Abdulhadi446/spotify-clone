name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site
        run: |
          if [ ! -f "index.html" ]; then
            echo "::error::index.html not found"
            exit 1
          fi
          echo "✓ index.html found"
          echo "Files to deploy:"
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' | sort

      - name: Inject download token
        run: |
          if [ -n "$GH_DOWNLOAD_TOKEN" ]; then
            sed -i "s|YOUR_FINE_GRAINED_TOKEN_HERE|${GH_DOWNLOAD_TOKEN}|" index.html
            echo "✓ Download token injected into index.html"
          else
            echo "::warning::GH_DOWNLOAD_TOKEN secret not set — cloud downloads will be disabled"
          fi
        env:
          GH_DOWNLOAD_TOKEN: ${{ secrets.GH_DOWNLOAD_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo "### 🌐 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Token injected:** ${{ secrets.GH_DOWNLOAD_TOKEN != '' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          fi
